<!DOCTYPE html>
<html data-mode="{{MODE}}" data-style="kanagawa-wave">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;">
<style>
  /* Generated by theme-builder.js from kanagawa.config.json */
  :root, html[data-mode="dark"] {
    --bg: #171421;
    --fg: #F1E8EE;
    --muted: #D4C3CF;
    --accent: #E6A9BD;
    --aqua: #9CD5C9;
    --green: #A7C986;
    --wave1: #47325C;
    --wave2: #A3B8EF;
    --glow: rgba(71, 50, 92, 0.32);
    --track: rgba(163, 184, 239, 0.16);
    --term-border: rgba(156, 213, 201, 0.28);
  }
  html[data-mode="light"] {
    --bg: #F3E4EA;
    --fg: #3E3442;
    --muted: #6F5F6D;
    --accent: #7D486D;
    --aqua: #7D486D;
    --green: #7D486D;
    --wave1: #7D486D;
    --wave2: #6F5F6D;
    --glow: rgba(250, 240, 244, 0.72);
    --track: rgba(62, 52, 66, 0.14);
    --term-border: rgba(62, 52, 66, 0.22);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 42%, var(--glow) 0%, var(--bg) 68%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-app-region: drag;
    -webkit-user-select: none;
  }
  html[data-style="minimal"] body {
    background: var(--bg);
  }
  html[data-style="terminal"] body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background:
      linear-gradient(180deg, rgba(156, 213, 201, 0.04) 0%, transparent 50%),
      var(--bg);
  }
  .emblem {
    width: 84px;
    height: 84px;
    margin-bottom: 20px;
    animation: float 3.2s ease-in-out infinite;
  }
  .emblem-minimal {
    width: 68px;
    height: 68px;
    animation: none;
  }
  .emblem-terminal {
    width: 64px;
    height: 64px;
    margin-bottom: 14px;
    animation: none;
  }
  .wave-back { animation: drift 4.5s ease-in-out infinite; transform-origin: center; }
  .wave-front { animation: drift 3.4s ease-in-out infinite reverse; transform-origin: center; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes drift {
    0%, 100% { transform: translateX(-2px); }
    50% { transform: translateX(2px); }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.12; }
  }
  .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: var(--muted);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .bar {
    width: 176px;
    height: 3px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .bar-fill {
    width: 48%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--wave1), var(--wave2), var(--accent));
    animation: slide 1.7s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(220%); }
  }
  .sub {
    font-size: 12px;
    color: var(--muted);
    opacity: 0.85;
  }
  .term-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 280px;
    max-width: 380px;
    padding: 20px 24px;
    border-radius: 10px;
    border: 1px solid var(--term-border);
    background: rgba(71, 50, 92, 0.14);
  }
  html[data-mode="light"] .term-card {
    background: rgba(250, 240, 244, 0.52);
  }
  .term-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .term-head .title {
    margin-bottom: 0;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--fg);
  }
  .term-prompt {
    color: var(--accent);
    font-weight: 700;
  }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--aqua);
    animation: blink 1.05s steps(1, end) infinite;
  }
  .term-bar {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .term-bar-fill {
    width: 40%;
    height: 100%;
    background: repeating-linear-gradient(90deg, var(--aqua) 0 10px, transparent 10px 13px);
    animation: slide 1.4s linear infinite;
  }
  .term-tag {
    color: var(--green);
    font-weight: 600;
    margin-right: 4px;
  }
</style>
</head>
<body>
  <svg class="emblem" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="48" cy="42" r="24" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="1.25"/>
    <path d="M48 22C34 22 36.5 52 25.5 63.5C21.5 67.5 25.8 68.8 28.6 66.8C39.2 59.5 38.5 46.5 48 46.5C57.5 46.5 56.8 59.5 67.4 66.8C70.2 68.8 74.5 67.5 70.5 63.5C59.5 52 62 22 48 22Z" fill="var(--fg)" fill-opacity="0.92"/>
    <path class="wave-back" d="M12 68C22 61 32 61 42 67C52 73 64 73 84 65" stroke="var(--wave2)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/>
    <path class="wave-front" d="M16 74C28 68 38 75 50 71C62 67 71 70 80 74" stroke="var(--wave1)" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div class="title">Antigravity</div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="sub">Ready for Sakura Dusk...</div>
</body>
</html>
